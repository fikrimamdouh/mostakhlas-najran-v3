name: OWASP ZAP Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap:
    name: ZAP Baseline - Production
    runs-on: ubuntu-latest
    steps:
      - name: Run passive baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'https://mostakhlas-najran.com'
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-mostakhlas-baseline
