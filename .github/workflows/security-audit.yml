name: Security Audit (Non-Blocking)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Secrets, SAST and Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks - secrets audit
        id: gitleaks
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source=/repo --redact --no-banner --exit-code 1

      - name: Semgrep - source code audit
        id: semgrep
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            semgrep/semgrep:1.176.0 \
            semgrep scan --config auto --metrics=off .

      - name: Trivy - dependencies and configuration audit
        id: trivy
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            aquasec/trivy:0.74.0 \
            fs --scanners vuln,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            /repo

      - name: Audit summary
        if: always()
        run: |
          echo "## Security Audit (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
          echo "| Scanner | Outcome |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gitleaks | ${{ steps.gitleaks.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Semgrep | ${{ steps.semgrep.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trivy | ${{ steps.trivy.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Audit mode only: findings do not block merge or deployment." >> "$GITHUB_STEP_SUMMARY"
