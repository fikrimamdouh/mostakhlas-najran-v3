name: Build Fikry Assistant APK

on:
  push:
    branches:
      - build/fikry-assistant-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Fikry-Assistant-v1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fikry-Assistant-v1
          path: Fikry-Assistant-v1.apk
          if-no-files-found: error
          retention-days: 7
