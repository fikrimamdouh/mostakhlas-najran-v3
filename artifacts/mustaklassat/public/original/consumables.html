    <style>
        :root {
            --primary-dark: #003087;
            --primary-main: #0056b3;
            --primary-light: #4a90e2;
            --secondary-accent: #fd7e14;
            --background-gradient-start: #f4f8ff;
            --background-gradient-end: #e7efff;
            --text-dark: #2c3e50;
            --text-light: #5a6a7a;
            --card-bg: #ffffff;
            --border-color: #dee2e6;
            --shadow-soft: 0 4px 12px rgba(0, 86, 179, 0.08     );
            --shadow-medium: 0 8px 25px rgba(0, 86, 179, 0.1);
            --status-yes-bg: #d4edda; --status-yes-text: #155724;
            --status-no-bg: #f8d7da; --status-no-text: #721c24;
            --visit-monthly-bg: #d1ecf1; --visit-monthly-text: #0c5460;
            --visit-done-bg: #e2e3e5; --visit-done-text: #383d41;
            --visit-future-bg: #fff3cd; --visit-future-text: #856404;
            --visit-postponed-bg: #f8d7da; --visit-postponed-text: #721c24;
            --summary-color-1: #e7f5ff;
            --summary-color-2: #e3faf0;
            --summary-color-3: #fff8e1;
            --summary-color-4: #fef2e4;
            --summary-color-5: #fdeeee;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 0;
            background-image: linear-gradient(120deg, var(--background-gradient-start), var(--background-gradient-end));
            color: var(--text-dark);
            direction: rtl;
            line-height: 1.7;
        }
        .container {
            max-width: 1700px;
            margin: 25px auto;
            padding: 30px;
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--shadow-medium);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .header-info {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
        }
        .logo-right, .logo-left {
            position: absolute;
            top: 0;
            width: 90px;
            height: auto;
        }
        .logo-right { right: 0; }
        .logo-left { left: 0; }
        .header-info h1 { color: var(--primary-dark); font-size: 32px; font-weight: 800; margin: 0; }
        .header-info h3 { color: var(--text-light); font-size: 22px; margin: 8px 0; }
        .header-info h2 { color: var(--primary-main); font-size: 26px; margin-top: 15px; font-weight: 700; }
        .page-contract-info {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 20px;
            background-color: var(--background-gradient-start);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
        }
        .page-contract-info p { margin: 0; font-size: 15px; }
        .page-contract-info strong { color: var(--primary-dark); }
        .nav-bar {
            background-color: var(--primary-dark);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            box-shadow: var(--shadow-soft);
        }
        .dropdown select {
            background-color: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 16px;
            width: 300px;
            font-weight: 500;
        }
        .main-action-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin: 25px 0;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            color: white;
            text-decoration: none;
            box-shadow: var(--shadow-soft);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-medium); }
        .btn-primary { background-color: var(--primary-main); }
        .btn-success { background-color: #28a745; }
        .btn-warning { background-color: #ffc107; color: var(--text-dark); }
        .btn-info { background-color: #17a2b8; }
        .btn-danger { background-color: #dc3545; }
        .btn-secondary { background-color: #6c757d; }
        .btn-print { background-color: var(--secondary-accent); }
        .btn-pdf { background-color: #e74c3c; }

        .table-section {
            margin: 35px 0;
            background: white;
            border-radius: 15px;
            box-shadow: var(--shadow-soft);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .table-header {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary-main));
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .table-header h2 { margin: 0; font-size: 22px; font-weight: 700; }
        .table-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .table-actions .btn { padding: 8px 15px; font-size: 13px; }

        .table-container { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            padding: 12px 8px;
            text-align: center;
            border: 1px solid var(--border-color);
            vertical-align: middle;
        }
        th {
            background-color: var(--background-gradient-start);
            color: var(--primary-dark);
            font-weight: 700;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tr:nth-child(even) { background-color: #f8f9fa; }
        tr:hover { background-color: #e3f2fd; }
        .editable {
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 4px;
            padding: 4px 8px;
            min-width: 80px;
            text-align: center;
        }
        .editable:focus { outline: 2px solid var(--primary-main); background-color: white; }
        .status-yes { background-color: var(--status-yes-bg); color: var(--status-yes-text); }
        .status-no { background-color: var(--status-no-bg); color: var(--status-no-text); }
        .visit-monthly { background-color: var(--visit-monthly-bg); color: var(--visit-monthly-text); }
        .visit-done { background-color: var(--visit-done-bg); color: var(--visit-done-text); }
        .visit-future { background-color: var(--visit-future-bg); color: var(--visit-future-text); }
        .visit-postponed { background-color: var(--visit-postponed-bg); color: var(--visit-postponed-text); }
        .summary-row { font-weight: 700; background-color: var(--summary-color-1) !important; }
        .summary-row:nth-child(2n) { background-color: var(--summary-color-2) !important; }
        .summary-row:nth-child(3n) { background-color: var(--summary-color-3) !important; }
        .summary-row:nth-child(4n) { background-color: var(--summary-color-4) !important; }
        .summary-row:nth-child(5n) { background-color: var(--summary-color-5) !important; }

        .penalty-info-bar {
            background: linear-gradient(135deg, #fff3cd, #ffeaa7);
            border: 1px solid #ffc107;
            border-radius: 12px;
            padding: 15px;
            margin: 20px 0;
            text-align: center;
            font-weight: 700;
            color: #856404;
        }
        .penalty-info-bar i { color: #ffc107; margin-left: 8px; }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-height: 80vh;
            overflow-y: auto;
        }
        .close {
            color: #aaa;
            float: left;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close:hover { color: #000; }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: var(--primary-dark);
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: 'Tajawal', sans-serif;
            font-size: 14px;
            box-sizing: border-box;
        }
        .form-group textarea { min-height: 100px; resize: vertical; }

        @media print {
            body { background: white; }
            .no-print, .main-action-buttons, .nav-bar, .table-actions, .btn { display: none !important; }
            .container { box-shadow: none; border: none; margin: 0; padding: 15px; max-width: none; }
            .table-section { box-shadow: none; border: 1px solid #000; page-break-inside: avoid; margin: 20px 0; }
            .table-header { background: #f0f0f0 !important; color: #000 !important; border-bottom: 1px solid #000; }
            table { font-size: 11px; }
            th, td { padding: 6px 4px; border: 1px solid #000; }
            .editable { background: transparent; border: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-info">
            <img src="najran_health_cluster_logo.png" alt="شعار التجمع" class="logo-right">
            <img src="najran_health_cluster_logo.png" alt="شعار التجمع" class="logo-left">
            <h1>تجمع نجران الصحي</h1>
            <h3>إدارة الصيانة والنظافة</h3>
            <h2>مستخلص المستهلكات</h2>
        </div>

        <div class="page-contract-info">
            <p><strong>المقاول:</strong> <span id="contractor-name">غير محدد</span></p>
            <p><strong>رقم العقد:</strong> <span id="contract-number">غير محدد</span></p>
            <p><strong>المستشفى:</strong> <span id="hospital-name">غير محدد</span></p>
            <p><strong>الفترة:</strong> <span id="extract-period">غير محدد</span></p>
        </div>

        <div class="nav-bar no-print">
            <div class="dropdown">
                <select id="page-navigation" onchange="navigateToPage(this.value)">
                    <option value="">اختر الصفحة</option>
                    <option value="attendance.html">الحضور والانصراف</option>
                    <option value="performance.html">شهادة الأداء</option>
                    <option value="achievement.html">شهادة الإنجاز</option>
                    <option value="spare_parts.html">قطع الغيار</option>
                    <option value="consumables.html" selected>المستهلكات</option>
                </select>
            </div>
        </div>

        <div class="main-action-buttons no-print">
            <button class="btn btn-success" onclick="saveAllData()"><i class="fas fa-save"></i> حفظ البيانات</button>
            <button class="btn btn-warning" onclick="loadData()"><i class="fas fa-download"></i> تحميل البيانات</button>
            <button class="btn btn-info" onclick="exportToExcel()"><i class="fas fa-file-excel"></i> تصدير Excel</button>
            <button class="btn btn-print" onclick="printAllSections()" id="print-all-btn"><i class="fas fa-print"></i> طباعة الكل</button>
            <button class="btn btn-pdf" onclick="exportToPDF()"><i class="fas fa-file-pdf"></i> تصدير PDF</button>
        </div>

        <div class="penalty-info-bar no-print">
            <i class="fas fa-info-circle"></i>
            يتم احتساب الغرامات وفقاً للعقد: 500 ريال لعدم تقديم تقارير مقاولي الباطن، 200 ريال لعدم تنفيذ الزيارات الشهرية
        </div>

        <!-- باقي محتوى الصفحة الأصلي محفوظ كما هو -->
    </div>
</body>
