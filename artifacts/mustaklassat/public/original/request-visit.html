<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة تسجيل ومتابعة الزيارات</title>
  <link rel="preload" as="script" href="/original/auth-check.js">
  <script src="/original/auth-check.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#173b6d;--blue:#2464a8;--gold:#c7a438;--bg:#eef3f8;--line:#dce5ef;--green:#14804a;--red:#b42318;--orange:#b54708;--muted:#66758a}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#173b6d,#2464a8);min-height:100vh;font-family:Tajawal,Arial,sans-serif;color:#172033}.shell{width:min(1180px,95%);margin:28px auto 60px;background:#fff;border-radius:21px;box-shadow:0 24px 65px rgba(0,0,0,.22);padding:30px}.header{text-align:center;border-bottom:2px solid var(--gold);padding-bottom:18px;margin-bottom:20px}.header img{width:78px}.header h1{font-size:24px;color:var(--navy);margin:8px 0 3px}.header p{color:var(--muted);margin:0;font-size:13px}.notice{padding:12px 14px;border-radius:11px;background:#eef6ff;border:1px solid #bad5ef;color:#245b92;font-size:13px;margin-bottom:15px}.warn{background:#fff6e7;border-color:#eed09b;color:#83520b}.error{background:#fff0ef;border-color:#efb8b3;color:#9f2d25}.section-title{font-size:17px;font-weight:800;color:var(--navy);display:flex;gap:8px;align-items:center;margin:24px 0 13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:14px 20px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#44546a;font-weight:800}.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:#fbfdff;outline:none}.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(36,100,168,.08);background:#fff}.field input[readonly]{background:#eef7f1;color:#16794a}.auto{font-size:10px;background:#e8f7ef;color:#14804a;border-radius:999px;padding:2px 7px}.visitors{display:flex;flex-direction:column;gap:13px}.visitor{border:1px solid var(--line);border-radius:14px;padding:16px;background:#f9fbfd}.visitor-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.visitor-title{font-weight:800;color:var(--navy)}.visitor-grid{display:grid;grid-template-columns:repeat(3,minmax(170px,1fr));gap:12px}.visitor-grid .full{grid-column:1/-1}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:10px;padding:10px 15px;font:inherit;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:disabled{opacity:.55;cursor:not-allowed}.primary{background:var(--navy);color:#fff}.success{background:var(--green);color:#fff}.danger{background:var(--red);color:#fff}.secondary{background:#eaf1f8;color:var(--navy);border:1px solid #cad8e7}.submit{width:100%;padding:14px;font-size:16px;margin-top:18px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:900px;font-size:12.5px}.table th,.table td{padding:10px 11px;border-bottom:1px solid #edf1f5;text-align:right}.table th{background:#f4f7fa;color:#475467;font-size:11.5px}.badge{display:inline-flex;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:800}.b-green{background:#e8f7ef;color:var(--green)}.b-orange{background:#fff2e3;color:var(--orange)}.b-red{background:#fdecea;color:var(--red)}.b-gray{background:#eef1f5;color:#596579}.muted{color:var(--muted)}.search{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.search input{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit}.toast{position:fixed;left:22px;bottom:22px;z-index:9999;max-width:420px;padding:13px 16px;border-radius:11px;color:#fff;font-weight:800;display:none;box-shadow:0 15px 40px rgba(0,0,0,.2)}.toast.ok{background:var(--green)}.toast.err{background:var(--red)}.empty{text-align:center;padding:25px;color:#8a96a7}@media(max-width:750px){.shell{padding:18px}.grid,.visitor-grid{grid-template-columns:1fr}.field.full,.visitor-grid .full{grid-column:1}.header h1{font-size:20px}}
  </style>
</head>
<body>
<div class="shell">
  <div class="header"><img src="/original/najran_health_cluster_logo.png" alt="الشعار"><h1>بوابة تسجيل ومتابعة زيارات مقاولي الباطن</h1><p>اختيار الأنظمة والشركات المعتمدة حسب الموقع</p></div>
  <div id="catalog-message" class="notice">جارٍ تحميل إعدادات الموقع...</div>

  <form id="visit-form">
    <div class="section-title"><i class="fas fa-location-dot"></i> معلومات الزيارة</div>
    <div class="grid">
      <div class="field"><label>الموقع / المنشأة <span class="auto">تلقائي</span></label><input id="site" readonly required></div>
      <div class="field"><label>مقاول الصيانة الرئيسي <span class="auto">تلقائي</span></label><input id="main-contractor" readonly required></div>
      <div class="field"><label>النظام المراد زيارته</label><select id="system-select" required></select><input id="system-manual" class="hidden" placeholder="اكتب اسم النظام"></div>
      <div class="field"><label>شركة مقاول الباطن</label><select id="contractor-select" required></select><input id="contractor-manual" class="hidden" placeholder="اكتب اسم شركة مقاول الباطن"></div>
      <div class="field"><label>تاريخ الزيارة</label><input type="date" id="visit-date" required></div>
    </div>

    <div class="section-title"><i class="fas fa-users"></i> الزوار</div>
    <div id="visitors" class="visitors"></div>
    <div class="actions"><button class="btn secondary" type="button" onclick="addVisitor()"><i class="fas fa-user-plus"></i> إضافة زائر آخر</button></div>
    <button class="btn success submit" id="submit-btn" type="submit"><i class="fas fa-paper-plane"></i> إرسال طلب الزيارة</button>
  </form>

  <div class="section-title"><i class="fas fa-clock-rotate-left"></i> طلباتي السابقة</div>
  <div class="search"><input id="search" placeholder="بحث في الطلبات"><button class="btn secondary" onclick="loadVisits()" type="button"><i class="fas fa-rotate"></i> تحديث</button></div>
  <div class="table-wrap"><table class="table"><thead><tr><th>الزائر</th><th>النظام</th><th>الشركة</th><th>تاريخ الزيارة</th><th>الحالة</th><th>رقم الصادر</th><th>التصريح</th></tr></thead><tbody id="visits-body"></tbody></table></div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
  'use strict';
  var state={catalog:{systems:[],contractors:[],approvals:[],representatives:[],representativeSystems:[]},visits:[],settings:{},visitorSeq:0,configured:false};
  function session(){try{return JSON.parse(localStorage.getItem('najran_session')||'{}')}catch(e){return{}}}
  async function token(force){try{if(typeof window.najranGetFreshToken==='function'){var t=await window.najranGetFreshToken(force?{skipCache:true}:undefined);if(t)return t}}catch(e){}return session().clerkToken||''}
  async function api(url,opt,retry){opt=opt||{};var t=await token(!!retry),h=new Headers(opt.headers||{});h.set('Authorization','Bearer '+t);if(opt.body&&!(opt.body instanceof FormData)&&!h.has('Content-Type'))h.set('Content-Type','application/json');var r=await fetch(url,Object.assign({},opt,{headers:h}));if(r.status===401&&!retry)return api(url,opt,true);var d=null;try{d=await r.json()}catch(e){}if(!r.ok)throw new Error((d&&d.error)||'فشل الاتصال بالنظام');return d}
  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function toast(msg,type){var e=document.getElementById('toast');e.textContent=msg;e.className='toast '+(type||'ok');e.style.display='block';clearTimeout(e._t);e._t=setTimeout(function(){e.style.display='none'},5000)}
  function fmt(v){if(!v)return'—';try{return new Date(v).toLocaleDateString('ar-SA')}catch(e){return v}}
  function status(v){var m={approved:['موافق عليه','b-green'],pending:['قيد المراجعة','b-orange'],rejected:['مرفوض','b-red']},x=m[v]||[v,'b-gray'];return'<span class="badge '+x[1]+'">'+x[0]+'</span>'}
  function currentSystemId(){return Number(document.getElementById('system-select').value)||null}
  function currentContractorId(){return Number(document.getElementById('contractor-select').value)||null}
  function contractorById(id){return state.catalog.contractors.find(function(x){return Number(x.id)===Number(id)})}
  function systemById(id){return state.catalog.systems.find(function(x){return Number(x.id)===Number(id)})}
  function repById(id){return state.catalog.representatives.find(function(x){return Number(x.id)===Number(id)})}

  function initializeContext(){var s=session(),cd={};try{cd=JSON.parse(localStorage.getItem('persistentContractData')||'{}')}catch(e){}var site=cd.hospitalName||localStorage.getItem('hospitalName')||s.hospital||'',main=cd.companyName||localStorage.getItem('companyName')||s.company||'';document.getElementById('site').value=site;document.getElementById('main-contractor').value=main;document.getElementById('visit-date').value=new Date().toISOString().slice(0,10)}

  async function loadCatalog(){var site=document.getElementById('site').value.trim(),msg=document.getElementById('catalog-message');try{var d=await api('/api/visits/catalog?site='+encodeURIComponent(site));state.catalog=d;state.configured=d.approvals&&d.approvals.length>0;if(state.configured){msg.className='notice';msg.textContent='تم تحميل الأنظمة والشركات المعتمدة للموقع. لا يمكن إرسال شركة غير معتمدة.';document.getElementById('system-select').classList.remove('hidden');document.getElementById('contractor-select').classList.remove('hidden');document.getElementById('system-manual').classList.add('hidden');document.getElementById('contractor-manual').classList.add('hidden');document.getElementById('system-select').required=true;document.getElementById('contractor-select').required=true;document.getElementById('system-manual').required=false;document.getElementById('contractor-manual').required=false;populateSystems()}else{msg.className='notice warn';msg.textContent='لم تُجهز اعتمادات هذا الموقع بعد. تم تفعيل الإدخال اليدوي مؤقتاً حتى تستكمل الإدارة الإعدادات.';document.getElementById('system-select').classList.add('hidden');document.getElementById('contractor-select').classList.add('hidden');document.getElementById('system-manual').classList.remove('hidden');document.getElementById('contractor-manual').classList.remove('hidden');document.getElementById('system-select').required=false;document.getElementById('contractor-select').required=false;document.getElementById('system-manual').required=true;document.getElementById('contractor-manual').required=true}refreshVisitorRepLists()}catch(e){msg.className='notice error';msg.textContent=e.message;toast(e.message,'err')}}
  function populateSystems(){var ids=[...new Set(state.catalog.approvals.map(function(a){return a.systemId}))],items=state.catalog.systems.filter(function(s){return ids.includes(s.id)});var el=document.getElementById('system-select');el.innerHTML='<option value="">اختر النظام</option>'+items.map(function(x){return'<option value="'+x.id+'">'+esc(x.name)+'</option>'}).join('');populateContractors()}
  function populateContractors(){var systemId=currentSystemId(),ids=state.catalog.approvals.filter(function(a){return Number(a.systemId)===systemId}).map(function(a){return a.contractorId}),items=state.catalog.contractors.filter(function(c){return ids.includes(c.id)}),el=document.getElementById('contractor-select');el.innerHTML='<option value="">اختر شركة مقاول الباطن</option>'+items.map(function(x){return'<option value="'+x.id+'">'+esc(x.name)+(x.documentStatus==='not_uploaded'?' — المستند لم يرفع':'')+'</option>'}).join('');refreshVisitorRepLists()}
  function validReps(){var contractorId=currentContractorId(),systemId=currentSystemId();return state.catalog.representatives.filter(function(r){if(Number(r.contractorId)!==contractorId)return false;var links=state.catalog.representativeSystems.filter(function(x){return Number(x.representativeId)===Number(r.id)});return!links.length||links.some(function(x){return Number(x.systemId)===systemId})})}

  window.addVisitor=function(){state.visitorSeq++;var id=state.visitorSeq,card=document.createElement('div');card.className='visitor';card.dataset.id=id;card.innerHTML='<div class="visitor-head"><div class="visitor-title"><i class="fas fa-user"></i> زائر</div>'+(document.querySelectorAll('.visitor').length?'<button type="button" class="btn danger" onclick="removeVisitor('+id+')">حذف</button>':'')+'</div><div class="visitor-grid"><div class="field full rep-choice-wrap"><label>اختيار مندوب مسجل (اختياري)</label><select class="rep-choice" onchange="selectRep('+id+',this.value)"><option value="">إدخال مندوب جديد</option></select></div><div class="field"><label>الاسم الكامل</label><input class="rep-name" required></div><div class="field"><label>رقم الهوية / الإقامة</label><input class="rep-id" inputmode="numeric" maxlength="10" required></div><div class="field"><label>رقم الجوال</label><input class="rep-mobile" required></div><div class="field full"><label>صورة الهوية / الإقامة <span class="muted">اختياري للمندوب الجديد — صورة أو PDF بحد أقصى 3MB</span></label><input class="rep-photo" type="file" accept="image/*,application/pdf"></div></div>';document.getElementById('visitors').appendChild(card);refreshVisitorRepLists();renumberVisitors()}
  window.removeVisitor=function(id){var c=document.querySelector('.visitor[data-id="'+id+'"]');if(c)c.remove();renumberVisitors()}
  function renumberVisitors(){document.querySelectorAll('.visitor').forEach(function(c,i){c.querySelector('.visitor-title').innerHTML='<i class="fas fa-user"></i> زائر '+(i+1)})}
  function refreshVisitorRepLists(){var reps=state.configured?validReps():[];document.querySelectorAll('.rep-choice').forEach(function(sel){var old=sel.value;sel.innerHTML='<option value="">إدخال مندوب جديد</option>'+reps.map(function(r){return'<option value="'+r.id+'">'+esc(r.fullName)+(r.hasIqama?' — إقامة مرفقة':' — يحتاج استكمال الإقامة')+'</option>'}).join('');if(reps.some(function(r){return String(r.id)===old}))sel.value=old})}
  window.selectRep=function(cardId,repId){var card=document.querySelector('.visitor[data-id="'+cardId+'"]'),r=repById(repId),fields=[card.querySelector('.rep-name'),card.querySelector('.rep-id'),card.querySelector('.rep-mobile')],photo=card.querySelector('.rep-photo');if(r){fields[0].value=r.fullName;fields[1].value=r.nationalId;fields[2].value=r.mobile||'';fields.forEach(function(x){x.readOnly=true});photo.disabled=true}else{fields.forEach(function(x){x.value='';x.readOnly=false});photo.disabled=false}}

  async function fileToData(file){if(!file)return null;if(file.size>3*1024*1024)throw new Error('حجم مرفق الإقامة أكبر من 3MB');return await new Promise(function(resolve,reject){var rd=new FileReader();rd.onload=function(){resolve(rd.result)};rd.onerror=function(){reject(new Error('تعذر قراءة المرفق'))};rd.readAsDataURL(file)})}
  document.getElementById('visit-form').addEventListener('submit',async function(e){e.preventDefault();var cards=[...document.querySelectorAll('.visitor')];if(!cards.length){toast('أضف زائراً واحداً على الأقل','err');return}var systemId=state.configured?currentSystemId():null,contractorId=state.configured?currentContractorId():null,systemName=state.configured?(systemById(systemId)||{}).name:document.getElementById('system-manual').value.trim(),contractorName=state.configured?(contractorById(contractorId)||{}).name:document.getElementById('contractor-manual').value.trim();if(!systemName||!contractorName){toast('اختر النظام والشركة','err');return}var btn=document.getElementById('submit-btn');btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> جارٍ الإرسال';var ok=0,fail=[];for(var i=0;i<cards.length;i++){var card=cards[i],choice=card.querySelector('.rep-choice').value,photo=null;try{photo=await fileToData(card.querySelector('.rep-photo').files[0]);var body={repName:card.querySelector('.rep-name').value.trim(),repId:card.querySelector('.rep-id').value.trim(),repMobile:card.querySelector('.rep-mobile').value.trim(),siteLocation:document.getElementById('site').value,mainContractor:document.getElementById('main-contractor').value,systemName:systemName,subContractor:contractorName,visitDate:document.getElementById('visit-date').value,repIdPhoto:photo,systemId:systemId,contractorId:contractorId,representativeId:choice||null};await api('/api/visits',{method:'POST',body:JSON.stringify(body)});ok++}catch(x){fail.push('زائر '+(i+1)+': '+x.message)}}btn.disabled=false;btn.innerHTML='<i class="fas fa-paper-plane"></i> إرسال طلب الزيارة';if(ok){toast('تم إرسال '+ok+' طلب بنجاح','ok');document.getElementById('visitors').innerHTML='';state.visitorSeq=0;addVisitor();await loadVisits()}if(fail.length)toast(fail.join(' | '),'err')});

  window.loadVisits=async function(){try{var d=await api('/api/visits');state.visits=d.visits||[];renderVisits()}catch(e){document.getElementById('visits-body').innerHTML='<tr><td colspan="7" class="empty">تعذر تحميل الطلبات</td></tr>';toast(e.message,'err')}}
  function renderVisits(){var q=(document.getElementById('search').value||'').toLowerCase(),rows=state.visits.filter(function(v){return!q||[v.repName,v.systemName,v.subContractor,v.repId,v.serialNumber].join(' ').toLowerCase().includes(q)});document.getElementById('visits-body').innerHTML=rows.length?rows.map(function(v){var action=v.status==='approved'?'<button class="btn primary" onclick="printPermit('+v.id+')">طباعة إلكترونية</button>'+(v.signedPermitFile?'<a class="btn secondary" href="'+esc(v.signedPermitFile)+'" download="تصريح-زيارة-'+esc(v.serialNumber||v.id)+'">نسخة موقعة</a>':''):'—';return'<tr><td><strong>'+esc(v.repName)+'</strong><br><span class="muted">'+esc(v.repId)+'</span></td><td>'+esc(v.systemName)+'</td><td>'+esc(v.subContractor)+'</td><td>'+fmt(v.visitDate)+'</td><td>'+status(v.status)+(v.adminNotes?'<br><span class="muted">'+esc(v.adminNotes)+'</span>':'')+'</td><td>'+esc(v.serialNumber||'—')+'</td><td>'+action+'</td></tr>'}).join(''):'<tr><td colspan="7" class="empty">لا توجد طلبات</td></tr>'}
  document.getElementById('search').addEventListener('input',renderVisits);document.getElementById('system-select').addEventListener('change',populateContractors);document.getElementById('contractor-select').addEventListener('change',refreshVisitorRepLists);

  window.printPermit=function(id){var v=state.visits.find(function(x){return Number(x.id)===Number(id)});if(!v)return;var year=v.approvedAt?new Date(v.approvedAt).getFullYear():new Date().getFullYear(),approved=v.approvedAt?fmt(v.approvedAt):'—',w=window.open('','_blank','width=900,height=1000');if(!w){toast('المتصفح منع نافذة الطباعة','err');return}var rows=[['الاسم',v.repName],['الموقع',v.siteLocation],['تاريخ الزيارة',fmt(v.visitDate)],['النظام',v.systemName],['رقم الهوية (الإقامة)',v.repId],['رقم الجوال',v.repMobile],['مقاول الصيانة',v.mainContractor],['مقاول الباطن',v.subContractor]];w.document.write('<!doctype html><html dir="rtl"><head><meta charset="utf-8"><title>تصريح زيارة</title><style>@page{size:A4;margin:12mm}body{font-family:Arial,Tahoma,sans-serif}.head{display:flex;gap:18px;align-items:center;border-bottom:3px solid #173b6d;padding-bottom:14px}.head img{width:75px}.head h1{font-size:22px;color:#173b6d;margin:0}.tbl{width:100%;border-collapse:collapse;margin:20px 0}.tbl td{border:1px solid #aaa;padding:10px}.tbl td:first-child{background:#f1f5f9;font-weight:bold;width:32%}.text{line-height:2;background:#eef6ff;border:1px solid #bad3ea;padding:14px;border-radius:10px}.sign{display:flex;justify-content:space-between;align-items:flex-end;border:1px solid #bbb;border-radius:10px;padding:18px;margin-top:24px}.stamp{width:120px;height:120px;border:2px dashed #aaa;border-radius:50%;display:flex;align-items:center;justify-content:center}.foot{font-size:11px;color:#666;margin-top:16px}</style></head><body><div class="head"><img src="/original/najran_health_cluster_logo.png"><div><div>تجمع نجران الصحي — إدارة الصيانة</div><h1>موافقة زيارة مقاولي الباطن</h1><div>رقم الصادر: <b>'+esc(v.serialNumber||'—')+' / '+year+'</b></div></div></div><table class="tbl">'+rows.map(function(r){return'<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1]||'—')+'</td></tr>'}).join('')+'</table><div class="text">توافق إدارة الصيانة بتجمع نجران الصحي بقيام مندوب مقاول الباطن الموضح اسمه وبياناته بعالية لزيارة الموقع لتنفيذ أعمال الصيانة الوقائية للنظام حسب شروط ومواصفات العقد.<br>وعلى ذلك جرى التوقيع،،،</div><div class="sign"><div><b>مدير إدارة الصيانة</b><p>الاسم: '+esc(state.settings.managerName||'م. محمد عباس المكرمي')+'</p><p>التاريخ: '+approved+' م</p><div style="margin-top:35px;border-top:1px solid #222;width:170px">التوقيع</div></div><div class="stamp">الختم</div></div><div class="foot">تم التحقق من بيانات الهوية/الإقامة إلكترونياً.</div><script>window.onload=function(){window.print()}<\/script></body></html>');w.document.close()}

  async function init(){initializeContext();addVisitor();try{var r=await Promise.all([loadCatalog(),api('/api/visits/settings')]);state.settings=r[1]||{}}catch(e){}await loadVisits()}
  init();
})();
</script>
</body>
</html>
