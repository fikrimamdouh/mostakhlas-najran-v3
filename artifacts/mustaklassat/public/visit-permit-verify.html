<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>التحقق من تصريح زيارة</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#eef3f9,#dce7f5);font-family:Tajawal,Arial,sans-serif;color:#172033}.card{width:min(620px,100%);background:#fff;border:1px solid #dbe4ef;border-radius:20px;box-shadow:0 22px 60px rgba(15,32,80,.16);overflow:hidden}.head{background:linear-gradient(135deg,#0f2050,#1e3c72);color:#fff;padding:22px;display:flex;align-items:center;gap:14px}.head img{width:62px;height:62px;object-fit:contain;background:#fff;border-radius:12px}.head h1{font-size:20px;margin:0}.head p{font-size:12px;color:#dbeafe;margin:4px 0 0}.body{padding:22px}.state{text-align:center;padding:28px 10px;color:#64748b;font-weight:700}.spinner{width:38px;height:38px;border:4px solid #dbeafe;border-top-color:#1e3c72;border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.status{display:block;width:max-content;margin:0 auto 18px;padding:7px 15px;border-radius:999px;font-weight:800}.active,.approved{background:#dcfce7;color:#166534}.expired{background:#e2e8f0;color:#475569}.cancelled,.rejected{background:#fee2e2;color:#991b1b}.pending{background:#fef3c7;color:#92400e}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{border:1px solid #e2e8f0;background:#f8fafc;border-radius:11px;padding:11px}.item small{display:block;color:#64748b;font-weight:700;margin-bottom:3px}.item strong{display:block;overflow-wrap:anywhere}.notice{margin-top:16px;border:1px solid #bfdbfe;background:#eff6ff;color:#1e40af;border-radius:11px;padding:11px;text-align:center;font-size:12px;font-weight:700}.error{border-color:#fecaca;background:#fef2f2;color:#991b1b}.foot{padding:13px 22px;border-top:1px solid #e2e8f0;text-align:center;color:#64748b;font-size:11px}@media(max-width:560px){.grid{grid-template-columns:1fr}.head{align-items:flex-start}.body{padding:16px}}
  </style>
</head>
<body>
  <main class="card">
    <header class="head"><img src="/original/najran_health_cluster_logo.png" alt="شعار تجمع نجران الصحي"><div><h1>التحقق من تصريح زيارة</h1><p>تجمع نجران الصحي — وحدة الصيانة العامة</p></div></header>
    <section class="body" id="result"><div class="state"><div class="spinner"></div>جارٍ التحقق من التصريح...</div></section>
    <footer class="foot">تعرض هذه الصفحة بيانات التصريح اللازمة للتحقق الأمني، ولا تعرض أرقام الهوية أو الجوال أو الوثائق المحمية.</footer>
  </main>
  <script>
    (function () {
      'use strict';
      var result = document.getElementById('result');
      function esc(value) { return String(value == null ? '' : value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
      function statusLabel(status) { return ({active:'التصريح ساري',approved:'التصريح معتمد',expired:'التصريح منتهي',cancelled:'التصريح ملغى',rejected:'التصريح مرفوض',pending:'بانتظار الاعتماد'})[status] || 'حالة غير معروفة'; }
      function dateText(value) { if (!value) return '—'; try { return new Date(String(value).slice(0,10) + 'T12:00:00Z').toLocaleDateString('ar-SA',{dateStyle:'long'}); } catch (_) { return String(value); } }
      function showError(message) { result.innerHTML = '<div class="notice error">' + esc(message || 'تعذر التحقق من التصريح') + '</div>'; }
      function showVisit(visit) {
        var names = Array.isArray(visit.representatives) && visit.representatives.length ? visit.representatives.map(function (row) { return row.fullName; }).filter(Boolean).join('، ') : visit.visitorName;
        var fields = [['رقم التصريح',visit.serialNumber],['المندوب / المندوبون',names],['شركة مقاول الباطن',visit.company],['النظام / المشروع',visit.system],['الموقع',visit.site],['بداية الزيارة',dateText(visit.startsAt || visit.visitDate)],['نهاية الزيارة',visit.endsAt ? dateText(visit.endsAt) : 'نهاية اليوم']];
        result.innerHTML = '<span class="status ' + esc(visit.status) + '">' + esc(statusLabel(visit.status)) + '</span><div class="grid">' + fields.map(function (field) { return '<div class="item"><small>' + esc(field[0]) + '</small><strong>' + esc(field[1] || '—') + '</strong></div>'; }).join('') + '</div><div class="notice">تم فحص حالة التصريح لحظيًا من نظام تجمع نجران الصحي.</div>';
      }
      async function verify() {
        var token = location.hash ? decodeURIComponent(location.hash.slice(1)).trim() : '';
        if (!token) { showError('رمز التحقق غير موجود'); return; }
        try {
          var response = await fetch('/api/visits/qr/public?token=' + encodeURIComponent(token), { method:'GET', credentials:'omit', cache:'no-store' });
          var body = await response.json().catch(function () { return {}; });
          if (!response.ok) throw new Error(body.error || 'تعذر التحقق من التصريح');
          showVisit(body.visit || {});
        } catch (error) { showError(error && error.message); }
      }
      verify();
    })();
  </script>
</body>
</html>
