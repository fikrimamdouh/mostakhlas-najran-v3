<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>نموذج طلب زيارة — تجمع نجران الصحي</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#eaf0f8,#f8fafc);font-family:Tajawal,Arial,sans-serif;color:#172033}.shell{width:min(980px,100%);margin:auto;padding:14px}.hero{display:flex;align-items:center;gap:15px;background:linear-gradient(135deg,#0f2050,#1e3c72 58%,#2a5298);color:#fff;padding:19px 21px;border-radius:17px;box-shadow:0 14px 34px rgba(15,32,80,.2)}.hero img{width:66px;height:66px;object-fit:contain;background:#fff;border-radius:12px}.hero h1{font-size:23px;margin:0}.hero p{font-size:12px;color:#dbeafe;margin:4px 0 0;line-height:1.7}.language-card{margin-top:13px;background:#fff;border:1px solid #dbe3ef;border-radius:15px;padding:15px;box-shadow:0 7px 24px rgba(15,32,80,.07)}.language-card strong{display:block;color:#1e3c72;margin-bottom:9px}.languages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.language{border:1.5px solid #cbd5e1;border-radius:10px;background:#f8fafc;padding:10px 8px;font:800 13px Tajawal;cursor:pointer;color:#334155}.language.active{background:#1e3c72;color:#fff;border-color:#1e3c72}.frame-card{margin-top:13px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:0;overflow:hidden;box-shadow:0 7px 24px rgba(15,32,80,.07)}iframe{display:block;width:100%;height:820px;border:0;background:transparent}@media(max-width:700px){.shell{padding:8px}.hero{align-items:flex-start;padding:15px}.hero img{width:54px;height:54px}.hero h1{font-size:19px}.languages{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero"><img src="/original/najran_health_cluster_logo.png" alt="شعار تجمع نجران الصحي"><div><h1 id="page-title">نموذج طلب زيارة</h1><p id="page-subtitle">تجمع نجران الصحي — اختر اللغة ثم أكمل بيانات طلب الزيارة.</p></div></header>
    <section class="language-card"><strong id="language-title">اختر لغة النموذج</strong><div class="languages"><button class="language" data-lang="ar">العربية</button><button class="language" data-lang="en">English</button><button class="language" data-lang="ur">اردو</button><button class="language" data-lang="hi">हिन्दी</button></div></section>
    <section class="frame-card"><iframe id="visit-form-frame" title="نموذج طلب زيارة تجمع نجران الصحي"></iframe></section>
  </main>
  <script>
    (function () {
      'use strict';
      var labels = {
        ar:{dir:'rtl',title:'نموذج طلب زيارة',subtitle:'تجمع نجران الصحي — اختر اللغة ثم أكمل بيانات طلب الزيارة.',language:'اختر لغة النموذج'},
        en:{dir:'ltr',title:'Visit Request Form',subtitle:'Najran Health Cluster — choose your language, then complete the visit request.',language:'Choose form language'},
        ur:{dir:'rtl',title:'وزٹ درخواست فارم',subtitle:'نجران ہیلتھ کلسٹر — زبان منتخب کریں، پھر وزٹ کی معلومات مکمل کریں۔',language:'فارم کی زبان منتخب کریں'},
        hi:{dir:'ltr',title:'विज़िट अनुरोध फ़ॉर्म',subtitle:'नजरान हेल्थ क्लस्टर — भाषा चुनें, फिर विज़िट अनुरोध पूरा करें।',language:'फ़ॉर्म की भाषा चुनें'}
      };
      var frame = document.getElementById('visit-form-frame');
      var current = localStorage.getItem('najran_visit_form_language') || 'ar';
      if (!labels[current]) current = 'ar';

      function coreUrl(language) {
        var params = new URLSearchParams(location.search);
        params.set('lang', language);
        return '/visit-request-form-core.html?' + params.toString();
      }

      function injectTranslation() {
        try {
          var doc = frame.contentDocument;
          if (!doc || !doc.body || doc.getElementById('najran-public-i18n-loader')) return;
          var script = doc.createElement('script');
          script.id = 'najran-public-i18n-loader';
          script.src = '/original/visit-public-form-i18n.js?v=20260716_multilingual_v1';
          doc.body.appendChild(script);
        } catch (_) {}
      }

      function setLanguage(language) {
        current = labels[language] ? language : 'ar';
        localStorage.setItem('najran_visit_form_language', current);
        var text = labels[current];
        document.documentElement.lang = current;
        document.documentElement.dir = text.dir;
        document.body.dir = text.dir;
        document.getElementById('page-title').textContent = text.title;
        document.getElementById('page-subtitle').textContent = text.subtitle;
        document.getElementById('language-title').textContent = text.language;
        document.querySelectorAll('[data-lang]').forEach(function (button) { button.classList.toggle('active', button.dataset.lang === current); });
        frame.src = coreUrl(current);
      }

      document.querySelectorAll('[data-lang]').forEach(function (button) { button.addEventListener('click', function () { setLanguage(button.dataset.lang); }); });
      frame.addEventListener('load', injectTranslation);
      window.addEventListener('message', function (event) {
        if (event.origin !== location.origin || !event.data || event.data.type !== 'visit-form-height') return;
        var height = Math.max(650, Math.min(1800, Number(event.data.height || 0) + 12));
        if (height) frame.style.height = height + 'px';
      });
      setLanguage(current);
    })();
  </script>
</body>
</html>
