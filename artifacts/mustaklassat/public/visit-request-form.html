<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>نموذج طلب زيارة — تجمع نجران الصحي</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#0f2050;--primary:#1e3c72;--blue:#2a5298;--green:#15803d;--red:#991b1b;--line:#dbe3ef;--muted:#64748b}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#eaf0f8,#f8fafc);font-family:Tajawal,Arial,sans-serif;color:#172033}.shell{width:min(940px,100%);margin:auto;padding:16px}.hero{display:flex;align-items:center;gap:15px;background:linear-gradient(135deg,var(--navy),var(--primary) 58%,var(--blue));color:#fff;padding:20px 22px;border-radius:17px;box-shadow:0 14px 34px rgba(15,32,80,.2)}.hero img{width:66px;height:66px;object-fit:contain;background:#fff;border-radius:12px}.hero h1{font-size:24px;margin:0}.hero p{font-size:12px;color:#dbeafe;margin:4px 0 0;line-height:1.7}.card{margin-top:14px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:20px;box-shadow:0 7px 24px rgba(15,32,80,.07)}.language-title{display:block;color:var(--primary);font-weight:800;margin-bottom:9px}.languages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.language{border:1.5px solid #cbd5e1;border-radius:10px;background:#f8fafc;padding:10px 8px;font:800 13px Tajawal;cursor:pointer;color:#334155}.language.active{background:var(--primary);color:#fff;border-color:var(--primary)}.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}.step{border:1px solid #bfdbfe;border-radius:10px;background:#eff6ff;color:#1e40af;padding:10px 12px;font-size:12px;line-height:1.65}.step b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#1e3c72;color:#fff;margin-inline-end:5px}.notice{border-radius:11px;padding:11px 13px;background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe;font-size:12px;line-height:1.7;margin-bottom:16px}.notice.manual{background:#f0fdf4;color:#166534;border-color:#bbf7d0}.notice.strict{background:#fff7ed;color:#9a3412;border-color:#fed7aa}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:#334155}.field input,.field select{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;font:inherit}.field input:focus,.field select:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(42,82,152,.09)}.field input[readonly]{background:#f8fafc;color:#475569}.field-hint{color:var(--muted);font-size:11px;line-height:1.6}.submit{grid-column:1/-1;border:0;border-radius:11px;padding:13px 18px;background:linear-gradient(135deg,#15803d,#166534);color:#fff;font:800 15px Tajawal;cursor:pointer}.submit:disabled{opacity:.58;cursor:not-allowed}.status{display:none;margin-top:14px;border-radius:11px;padding:12px 14px;font-weight:700;line-height:1.7}.status.show{display:block}.status.ok{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}.status.error{background:#fef2f2;color:var(--red);border:1px solid #fecaca}.privacy{font-size:11px;color:var(--muted);line-height:1.8;margin:13px 0 0}.hp{position:absolute!important;right:-9999px!important;width:1px!important;height:1px!important;overflow:hidden!important}@media(max-width:700px){.shell{padding:9px}.hero{align-items:flex-start;padding:16px}.hero img{width:54px;height:54px}.hero h1{font-size:20px}.card{padding:15px}.languages{grid-template-columns:repeat(2,minmax(0,1fr))}.steps,.grid{grid-template-columns:1fr}.field.full,.submit{grid-column:auto}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero"><img src="/original/najran_health_cluster_logo.png" alt="Najran Health Cluster"><div><h1 id="title"></h1><p id="subtitle"></p></div></header>
    <section class="card"><strong id="language-title" class="language-title"></strong><div class="languages"><button class="language" data-lang="ar" type="button">العربية</button><button class="language" data-lang="en" type="button">English</button><button class="language" data-lang="ur" type="button">اردو</button><button class="language" data-lang="hi" type="button">हिन्दी</button></div></section>
    <section class="card">
      <div id="steps" class="steps"></div>
      <div id="mode-notice" class="notice"></div>
      <form id="request-form" class="grid" autocomplete="on">
        <div class="field"><label id="maintenance-label" for="maintenance"></label><select id="maintenance" required></select></div>
        <div class="field"><label id="site-label" for="site"></label><select id="site" required></select></div>
        <div class="field"><label id="date-label" for="visit-date"></label><input id="visit-date" type="date" required></div>
        <div class="field"><label id="system-label" for="system"></label><select id="system" required></select></div>
        <div class="field full"><label id="contractor-label" for="contractor"></label><select id="contractor" required></select></div>
        <div class="field full" id="contractor-other-field" hidden><label id="contractor-other-label" for="contractor-other"></label><input id="contractor-other" maxlength="250" autocomplete="organization"></div>
        <div class="field full"><label id="representative-label" for="representative"></label><select id="representative" required></select><small id="representative-hint" class="field-hint"></small></div>
        <div class="field full"><label id="name-label" for="full-name"></label><input id="full-name" maxlength="200" required autocomplete="name"></div>
        <div class="field"><label id="identity-label" for="identity"></label><input id="identity" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required autocomplete="off"></div>
        <div class="field"><label id="mobile-label" for="mobile"></label><input id="mobile" inputmode="tel" maxlength="14" required autocomplete="tel" placeholder="05xxxxxxxx"></div>
        <div class="hp" aria-hidden="true"><label for="website">Website</label><input id="website" tabindex="-1" autocomplete="off"></div>
        <button id="submit" class="submit" type="submit"></button>
      </form>
      <div id="status" class="status" aria-live="polite"></div>
      <p id="privacy" class="privacy"></p>
    </section>
  </main>
  <script>
    (function () {
      'use strict';

      var messages = {
        ar:{dir:'rtl',title:'نموذج طلب زيارة',subtitle:'تجمع نجران الصحي — نموذج عام لجميع المواقع لتسجيل زيارات مقاولي الباطن.',language:'اختر لغة النموذج',steps:['اختر الموقع والنظام والشركة','اختر مندوبًا معتمدًا أو أضف مندوبًا جديدًا','أرسل الطلب للمراجعة'],maintenance:'مقاول الصيانة',site:'الموقع / المستشفى',date:'تاريخ الزيارة المطلوب',system:'النظام المراد زيارته',contractor:'شركة مقاول الباطن',other:'شركة أخرى غير مدرجة',otherHint:'اكتب اسم شركة مقاول الباطن',representative:'المندوب',representativeHint:'تظهر أسماء المندوبين المعتمدين لهذه الشركة والنظام فقط، مع إخفاء رقم الهوية.',newRepresentative:'إضافة مندوب جديد',noRepresentatives:'لا يوجد مندوب معتمد — أضف مندوبًا جديدًا',loadingRepresentatives:'جارٍ تحميل المندوبين المعتمدين...',name:'اسم الزائر الكامل',identity:'رقم الهوية / الإقامة',mobile:'رقم الجوال السعودي',submit:'إرسال طلب الزيارة',privacy:'تُستخدم البيانات لمراجعة طلب الزيارة وإصدار التصريح فقط. لا يظهر رقم الهوية أو الجوال للمندوبين المعتمدين في القائمة العامة.',select:'اختر',loading:'جارٍ التحميل...',manual:'يمكن اختيار مندوب معتمد أو إضافة مندوب جديد؛ الطلب الجديد يظل بانتظار مراجعة الإدارة.',strict:'المطابقة مع المندوب المعتمد مفعلة؛ أدخل الهوية والجوال للتأكيد قبل الإرسال.',success:'تم إرسال طلب الزيارة بنجاح إلى الإدارة للمراجعة.',failure:'تعذر إرسال طلب الزيارة'},
        en:{dir:'ltr',title:'Visit Request Form',subtitle:'Najran Health Cluster — one public form for subcontractor visits at all sites.',language:'Choose form language',steps:['Choose site, system and company','Choose an approved representative or add a new one','Submit the request for review'],maintenance:'Maintenance contractor',site:'Site / Hospital',date:'Requested visit date',system:'System to be visited',contractor:'Subcontractor company',other:'Other company (not listed)',otherHint:'Type the subcontractor company name',representative:'Representative',representativeHint:'Only approved representatives for the selected company and system are listed. Identity numbers stay masked.',newRepresentative:'Add a new representative',noRepresentatives:'No approved representative — add a new one',loadingRepresentatives:'Loading approved representatives...',name:'Visitor full name',identity:'National ID / Iqama number',mobile:'Saudi mobile number',submit:'Submit visit request',privacy:'Data is used only to review the visit and issue the permit. Approved representatives’ ID and mobile are not displayed publicly.',select:'Select',loading:'Loading...',manual:'Choose an approved representative or add a new one. New entries remain pending management review.',strict:'Approved representative matching is enabled. Enter ID and mobile for confirmation.',success:'The visit request was sent successfully for review.',failure:'Unable to submit the visit request'},
        ur:{dir:'rtl',title:'وزٹ درخواست فارم',subtitle:'نجران ہیلتھ کلسٹر — تمام مقامات کے لیے ذیلی ٹھیکیدار وزٹ کا عمومی فارم۔',language:'فارم کی زبان منتخب کریں',steps:['مقام، نظام اور کمپنی منتخب کریں','منظور شدہ نمائندہ منتخب کریں یا نیا شامل کریں','درخواست جائزے کے لیے بھیجیں'],maintenance:'مینٹیننس کنٹریکٹر',site:'مقام / ہسپتال',date:'مطلوبہ وزٹ کی تاریخ',system:'وزٹ کا نظام',contractor:'ذیلی ٹھیکیدار کمپنی',other:'دیگر کمپنی',otherHint:'کمپنی کا نام لکھیں',representative:'نمائندہ',representativeHint:'صرف منتخب کمپنی اور نظام کے منظور شدہ نمائندے دکھائے جاتے ہیں؛ شناختی نمبر مخفی رہتا ہے۔',newRepresentative:'نیا نمائندہ شامل کریں',noRepresentatives:'منظور شدہ نمائندہ موجود نہیں — نیا شامل کریں',loadingRepresentatives:'منظور شدہ نمائندے لوڈ ہو رہے ہیں...',name:'وزیٹر کا مکمل نام',identity:'شناختی کارڈ / اقامہ نمبر',mobile:'سعودی موبائل نمبر',submit:'وزٹ درخواست بھیجیں',privacy:'معلومات صرف درخواست کے جائزے اور اجازت نامہ جاری کرنے کے لیے استعمال ہوتی ہیں۔',select:'منتخب کریں',loading:'لوڈ ہو رہا ہے...',manual:'منظور شدہ نمائندہ منتخب کریں یا نیا شامل کریں؛ نئی درخواست انتظامیہ کے جائزے میں رہے گی۔',strict:'منظور شدہ نمائندے کی تصدیق فعال ہے؛ شناختی نمبر اور موبائل درج کریں۔',success:'درخواست کامیابی سے بھیج دی گئی۔',failure:'درخواست نہیں بھیجی جا سکی'},
        hi:{dir:'ltr',title:'विज़िट अनुरोध फ़ॉर्म',subtitle:'नजरान हेल्थ क्लस्टर — सभी स्थानों के लिए उप-ठेकेदार विज़िट का सामान्य फ़ॉर्म।',language:'फ़ॉर्म की भाषा चुनें',steps:['स्थान, सिस्टम और कंपनी चुनें','स्वीकृत प्रतिनिधि चुनें या नया जोड़ें','समीक्षा के लिए अनुरोध भेजें'],maintenance:'रखरखाव ठेकेदार',site:'स्थान / अस्पताल',date:'अनुरोधित विज़िट तिथि',system:'विज़िट किया जाने वाला सिस्टम',contractor:'उप-ठेकेदार कंपनी',other:'अन्य कंपनी',otherHint:'कंपनी का नाम लिखें',representative:'प्रतिनिधि',representativeHint:'केवल चुनी गई कंपनी और सिस्टम के स्वीकृत प्रतिनिधि दिखते हैं; पहचान संख्या छिपी रहती है।',newRepresentative:'नया प्रतिनिधि जोड़ें',noRepresentatives:'कोई स्वीकृत प्रतिनिधि नहीं — नया जोड़ें',loadingRepresentatives:'स्वीकृत प्रतिनिधि लोड हो रहे हैं...',name:'आगंतुक का पूरा नाम',identity:'राष्ट्रीय पहचान / इकामा नंबर',mobile:'सऊदी मोबाइल नंबर',submit:'विज़िट अनुरोध भेजें',privacy:'डेटा का उपयोग केवल समीक्षा और परमिट जारी करने के लिए किया जाता है।',select:'चुनें',loading:'लोड हो रहा है...',manual:'स्वीकृत प्रतिनिधि चुनें या नया जोड़ें; नई प्रविष्टि प्रबंधन समीक्षा में रहेगी।',strict:'स्वीकृत प्रतिनिधि मिलान चालू है; पुष्टि के लिए पहचान और मोबाइल दर्ज करें।',success:'अनुरोध सफलतापूर्वक भेजा गया।',failure:'अनुरोध नहीं भेजा जा सका'}
      };

      var language = localStorage.getItem('najran_visit_form_language') || new URLSearchParams(location.search).get('lang') || 'ar';
      if (!messages[language]) language = 'ar';
      var catalog = null;
      var policy = { requireApprovedRepresentative:false };
      var representatives = [];
      var representativeLoadSequence = 0;
      var form = document.getElementById('request-form');
      var maintenance = document.getElementById('maintenance');
      var site = document.getElementById('site');
      var visitDate = document.getElementById('visit-date');
      var system = document.getElementById('system');
      var contractor = document.getElementById('contractor');
      var representative = document.getElementById('representative');
      var fullName = document.getElementById('full-name');
      var identity = document.getElementById('identity');
      var mobile = document.getElementById('mobile');
      var submit = document.getElementById('submit');
      var status = document.getElementById('status');

      function t(){return messages[language] || messages.ar}
      function esc(value){return String(value==null?'':value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
      function localDay(){var date=new Date();date.setMinutes(date.getMinutes()-date.getTimezoneOffset());return date.toISOString().slice(0,10)}
      function activeOnDate(row,day){return row&&row.status==='active'&&(!row.validFrom||row.validFrom<=day)&&(!row.validUntil||row.validUntil>=day)}
      function option(value,label,selected){return '<option value="'+esc(value)+'"'+(String(value)===String(selected||'')?' selected':'')+'>'+esc(label)+'</option>'}
      function setStatus(message,ok){status.textContent=message;status.className='status show '+(ok?'ok':'error')}
      function numberValue(value){var parsed=Number(value);return Number.isFinite(parsed)?parsed:0}

      function applyLanguage(next){
        language=messages[next]?next:'ar';
        localStorage.setItem('najran_visit_form_language',language);
        var m=t();
        document.documentElement.lang=language;document.documentElement.dir=m.dir;document.body.dir=m.dir;document.title=m.title+' — Najran Health Cluster';
        document.getElementById('title').textContent=m.title;document.getElementById('subtitle').textContent=m.subtitle;document.getElementById('language-title').textContent=m.language;document.getElementById('steps').innerHTML=m.steps.map(function(row,index){return '<div class="step"><b>'+(index+1)+'</b>'+esc(row)+'</div>'}).join('');
        document.getElementById('maintenance-label').textContent=m.maintenance;document.getElementById('site-label').textContent=m.site;document.getElementById('date-label').textContent=m.date;document.getElementById('system-label').textContent=m.system;document.getElementById('contractor-label').textContent=m.contractor;document.getElementById('contractor-other-label').textContent=m.other;document.getElementById('contractor-other').placeholder=m.otherHint;document.getElementById('representative-label').textContent=m.representative;document.getElementById('representative-hint').textContent=m.representativeHint;document.getElementById('name-label').textContent=m.name;document.getElementById('identity-label').textContent=m.identity;document.getElementById('mobile-label').textContent=m.mobile;submit.textContent=m.submit;document.getElementById('privacy').textContent=m.privacy;
        document.querySelectorAll('[data-lang]').forEach(function(button){button.classList.toggle('active',button.dataset.lang===language)});
        renderPolicy();populateCatalog(true);renderRepresentativeOptions(representative.value);
      }

      function renderPolicy(){var m=t(),notice=document.getElementById('mode-notice'),strict=policy.requireApprovedRepresentative===true;notice.className='notice '+(strict?'strict':'manual');notice.textContent=strict?m.strict:m.manual}
      function maintenanceRows(){return catalog&&Array.isArray(catalog.maintenanceContractors)?catalog.maintenanceContractors:[]}
      function validApprovals(){var day=visitDate.value;return catalog&&Array.isArray(catalog.siteApprovals)?catalog.siteApprovals.filter(function(row){return row.siteName===site.value&&activeOnDate(row,day)}):[]}
      function qualificationValid(systemId,contractorId){var day=visitDate.value;return !!(catalog&&Array.isArray(catalog.qualifications)&&catalog.qualifications.some(function(row){return numberValue(row.systemId)===numberValue(systemId)&&numberValue(row.contractorId)===numberValue(contractorId)&&activeOnDate(row,day)}))}

      function refreshSites(preferred){
        var row=maintenanceRows().find(function(item){return item.key===maintenance.value});
        site.innerHTML=option('',t().select+' '+t().site,'')+(row&&Array.isArray(row.sites)?row.sites.map(function(name){return option(name,name,preferred)}).join(''):'');
        if(preferred)site.value=preferred;
        refreshSystems(system.value);
      }

      function refreshSystems(preferred){
        var current=preferred||system.value;
        var rows=catalog&&Array.isArray(catalog.systems)?catalog.systems.slice():[];
        system.innerHTML=option('',t().select+' '+t().system,'')+rows.map(function(row){return option(row.id,row.displayName||row.name,current)}).join('');
        if(!rows.some(function(row){return String(row.id)===String(current)}))system.value='';
        refreshContractors(contractor.value);
      }

      function refreshContractors(preferred){
        var current=preferred||contractor.value;
        var selectedSystemId=numberValue(system.value);
        var allowed={};
        validApprovals().forEach(function(row){
          var rowSystemId=numberValue(row.systemId),rowContractorId=numberValue(row.contractorId);
          if(selectedSystemId&&rowSystemId===selectedSystemId&&qualificationValid(rowSystemId,rowContractorId))allowed[rowContractorId]=true;
        });
        var rows=catalog&&Array.isArray(catalog.contractors)?catalog.contractors.filter(function(row){return !!allowed[numberValue(row.id)]}):[];
        contractor.innerHTML=option('',t().select+' '+t().contractor,'')+rows.map(function(row){return option(row.id,row.displayName||row.name,current)}).join('')+option('__other__',t().other,current);
        if(String(current)!=='__other__'&&!rows.some(function(row){return String(row.id)===String(current)}))contractor.value='';
        toggleOtherContractor();
        loadRepresentatives(representative.value);
      }

      function toggleOtherContractor(){
        var isOther=contractor.value==='__other__',field=document.getElementById('contractor-other-field'),input=document.getElementById('contractor-other');
        field.hidden=!isOther;input.required=isOther;if(!isOther)input.value='';
      }

      function renderRepresentativeOptions(preferred){
        var current=preferred||representative.value;
        var m=t();
        var rows=representatives.slice();
        representative.innerHTML=option('',m.select+' '+m.representative,'')+rows.map(function(row){return option(row.id,row.fullName+' — '+row.identityMasked,current)}).join('')+option('__new__',rows.length?m.newRepresentative:m.noRepresentatives,current);
        if(!rows.some(function(row){return String(row.id)===String(current)})&&String(current)!=='__new__')representative.value=rows.length?'':'__new__';
        if(!rows.length)representative.value='__new__';
        applyRepresentativeMode();
      }

      async function loadRepresentatives(preferred){
        var sequence=++representativeLoadSequence;
        representatives=[];
        var contractorId=numberValue(contractor.value),systemId=numberValue(system.value);
        if(!contractorId||!systemId||!site.value||!visitDate.value||contractor.value==='__other__'){
          renderRepresentativeOptions('__new__');
          return;
        }
        representative.innerHTML=option('',t().loadingRepresentatives,'');
        representative.disabled=true;
        try{
          var query=new URLSearchParams({siteLocation:site.value,systemId:String(systemId),contractorId:String(contractorId),visitDate:visitDate.value});
          var response=await fetch('/api/visits/public/representatives?'+query.toString(),{cache:'no-store'});
          var body=await response.json().catch(function(){return{}});
          if(!response.ok)throw new Error(body.error||t().failure);
          if(sequence!==representativeLoadSequence)return;
          representatives=Array.isArray(body.representatives)?body.representatives:[];
          renderRepresentativeOptions(preferred);
        }catch(error){
          if(sequence!==representativeLoadSequence)return;
          representatives=[];renderRepresentativeOptions('__new__');setStatus(error.message||t().failure,false);
        }finally{
          if(sequence===representativeLoadSequence)representative.disabled=false;
        }
      }

      function applyRepresentativeMode(){
        var selected=representatives.find(function(row){return String(row.id)===String(representative.value)});
        if(selected){
          fullName.value=selected.fullName;fullName.readOnly=true;
        }else{
          if(fullName.readOnly)fullName.value='';
          fullName.readOnly=false;
        }
      }

      function populateCatalog(preserve){
        if(!catalog)return;
        var params=new URLSearchParams(location.search);
        var currentMaintenance=preserve?maintenance.value:params.get('maintenance')||'';
        var currentSite=preserve?site.value:params.get('site')||'';
        maintenance.innerHTML=option('',t().select+' '+t().maintenance,'')+maintenanceRows().map(function(row){return option(row.key,row.name,currentMaintenance)}).join('');
        if(currentMaintenance)maintenance.value=currentMaintenance;
        refreshSites(currentSite);
      }

      async function load(){
        submit.disabled=true;
        try{
          var responses=await Promise.all([fetch('/api/visits/public/request-catalog',{cache:'no-store'}),fetch('/api/visits/public/request-policy',{cache:'no-store'})]);
          var catalogBody=await responses[0].json().catch(function(){return{}}),policyBody=await responses[1].json().catch(function(){return{}});
          if(!responses[0].ok)throw new Error(catalogBody.error||t().failure);
          catalog=catalogBody;policy=responses[1].ok?policyBody:{requireApprovedRepresentative:false};populateCatalog(false);renderPolicy();
        }catch(error){setStatus(error.message||t().failure,false)}finally{submit.disabled=false}
      }

      form.addEventListener('submit',async function(event){
        event.preventDefault();if(!form.reportValidity())return;
        submit.disabled=true;submit.textContent=t().loading;
        try{
          var approvedRepresentative=representatives.find(function(row){return String(row.id)===String(representative.value)});
          var response=await fetch('/api/visits/public/requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
            maintenanceContractorKey:maintenance.value,
            siteLocation:site.value,
            visitDate:visitDate.value,
            systemId:numberValue(system.value),
            contractorId:contractor.value==='__other__'?0:numberValue(contractor.value),
            contractorName:contractor.value==='__other__'?document.getElementById('contractor-other').value.trim():'',
            representativeId:approvedRepresentative?approvedRepresentative.id:null,
            representativeMode:approvedRepresentative?'approved':'new',
            fullName:fullName.value.trim(),
            identityNumber:identity.value.trim(),
            mobile:mobile.value.trim(),
            website:document.getElementById('website').value
          })});
          var body=await response.json().catch(function(){return{}});
          if(!response.ok)throw new Error(body.error||t().failure);
          setStatus(body.message||t().success,true);
          identity.value='';mobile.value='';
          if(!approvedRepresentative)fullName.value='';
        }catch(error){setStatus(error.message||t().failure,false)}finally{submit.disabled=false;submit.textContent=t().submit}
      });

      maintenance.addEventListener('change',function(){refreshSites()});
      site.addEventListener('change',function(){refreshSystems(system.value)});
      visitDate.addEventListener('change',function(){refreshContractors(contractor.value)});
      system.addEventListener('change',function(){refreshContractors()});
      contractor.addEventListener('change',function(){toggleOtherContractor();loadRepresentatives()});
      representative.addEventListener('change',applyRepresentativeMode);
      document.querySelectorAll('[data-lang]').forEach(function(button){button.addEventListener('click',function(){applyLanguage(button.dataset.lang)})});
      visitDate.min=localDay();visitDate.value=localDay();applyLanguage(language);load();
    })();
  </script>
</body>
</html>
